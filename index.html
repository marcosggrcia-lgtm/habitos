<style>
:root{
  --paper:#EFEDE6; --card:#F8F7F2; --ink:#4F4A3A; --mid:#857E69; --sand:#D3CDB9;
  --line:#DCD7C7; --text:#3A362B; --muted:#7C765F; --neg:#9C4B3B; --pos:#5E7A4C;
  --on:#4F4A3A; --oncheck:#F8F7F2; --r:6px;
  --font: "Avenir Next","Segoe UI Variable","Segoe UI",Inter,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
[data-theme="dark"]{
  --paper:#1B1A16; --card:#24231E; --ink:#E6E2D3; --mid:#A59E88; --sand:#3A372E;
  --line:#34322A; --text:#ECE9DF; --muted:#A59E88; --neg:#D3877A; --pos:#9FBE8A;
  --on:#D9D4C3; --oncheck:#1B1A16;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mid);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:28px} h2{font-size:17px} h3{font-size:14px;color:var(--muted);font-weight:500}

/* ---------- chrome ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:18px;padding:12px 20px;padding-top:max(12px,env(safe-area-inset-top))}
.brand{font-weight:600;letter-spacing:-.02em;font-size:16px}
.tabs{display:flex;gap:4px;margin-left:8px}
.tab{padding:7px 12px;border-radius:var(--r);color:var(--muted)}
.tab.on{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.spacer{flex:1}
.icon{width:36px;height:36px;border-radius:var(--r);display:grid;place-items:center;color:var(--muted)}
.icon:hover{background:var(--card)}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--sand);flex:none;margin-right:2px;transition:background .3s}
.syncdot.ok{background:var(--pos)}
.syncdot.err,.syncdot.auth{background:var(--neg)}
.banner{background:var(--sand);color:var(--text);padding:8px 20px;font-size:13px;display:none}
.banner.show{display:block}
main{max-width:1180px;margin:0 auto;padding:22px 20px 96px}
.tabbar{display:none}

/* ---------- blocks ---------- */
.block{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.row>*,.summary>*,.stats3>*,.bud-cols>*{min-width:0}
#view>.block+.block{margin-top:14px}
.row{display:grid;gap:14px;margin-top:14px}
.row.c3{grid-template-columns:2fr 1fr 1.3fr}
.row.c2{grid-template-columns:1.4fr 1fr}
.row.c4{grid-template-columns:repeat(4,1fr)}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.tiny{font-size:12px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.big{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.btn{padding:8px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--text)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--neg)}
.btn.small{padding:5px 9px;font-size:13px}
select.sel,input.inp{padding:7px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);min-width:0}
input.inp{width:100%}
input[type=number]{text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);font-weight:500}
td.r,th.r{text-align:right}
tr.total td{font-weight:600;border-top:1px solid var(--mid)}
.bar{height:8px;background:var(--sand);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .35s}
.empty{color:var(--muted);padding:18px 0;text-align:center;font-size:14px}

/* ---------- habits ---------- */
.hab-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav .icon{width:32px;height:32px}
.today{margin-left:auto;display:flex;align-items:center;gap:12px}
.ring{width:54px;height:54px}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--sand)} .ring .fg{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring.full .fg{animation:pop .5s ease}
@keyframes pop{50%{stroke-width:9}}
.grid-wrap{overflow:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
.hgrid{border-collapse:separate;border-spacing:0;width:auto}
.hgrid th,.hgrid td{padding:0;border:0;text-align:center;font-size:12px}
.hgrid thead th{color:var(--muted);font-weight:500;height:24px;line-height:24px}
.hgrid thead tr:nth-child(2) th{font-size:11px}
.hgrid thead tr:nth-child(3) th{font-weight:600;color:var(--text)}
.hgrid th.wk{border-bottom:1px solid var(--line);padding:0 4px;white-space:nowrap}
.hgrid th.wk + th.wk{border-left:1px solid var(--line)}
.hgrid th.we{background:var(--sand);border-radius:3px}
.hgrid th.today{box-shadow:inset 0 -2px 0 var(--ink)}
.hgrid .hname{position:sticky;left:0;background:var(--card);text-align:left;padding-right:12px;min-width:150px;z-index:2;
  border-right:1px solid var(--line);font-size:13px}
.hgrid thead .hname{font-size:15px;font-weight:600;color:var(--text);vertical-align:bottom;padding-bottom:4px}
.hgrid tbody .hname button{text-align:left;padding:4px 0;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;color:var(--text)}
.hgrid tbody .hname button:hover{color:var(--mid)}
.hgrid td{width:30px;height:32px}
.hgrid td.off{opacity:.25;pointer-events:none}
.cb{width:22px;height:22px;border-radius:5px;border:1.5px solid var(--sand);background:transparent;display:grid;place-items:center;
  margin:0 auto;transition:transform .12s,background .12s,border-color .12s}
.cb:hover{border-color:var(--mid)}
[data-theme="dark"] .cb{border-color:#4B483D}
.cb.on{background:var(--on);border-color:var(--on);color:var(--oncheck)}
.cb.on svg{display:block}
.cb svg{display:none;width:13px;height:13px}
.cb:active{transform:scale(.85)}
.hgrid tbody tr:hover .hname{color:var(--mid)}
.addhab{margin-top:10px;color:var(--muted);font-size:13px;padding:6px 0}
.addhab:hover{color:var(--text)}
.mm{width:26px;height:26px;border-radius:5px;margin:0 auto;font-size:12px;color:var(--text);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.mm.empty{color:var(--sand)}
.mm:hover{background:var(--sand)}
.stats3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r)}
.donut-wrap{display:flex;align-items:center;gap:16px}
.kv{flex:1;min-width:0}.kv>div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.kv>div:last-child{border:0}.kv b{font-size:20px;font-weight:600}
.legend{font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.top10 li{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.top10 li:last-child{border:0}
.top10 ol{margin:0;padding:0;list-style:none;counter-reset:n}
.top10 li::before{counter-increment:n;content:counter(n);width:20px;color:var(--muted);font-variant-numeric:tabular-nums}
.top10 li span:last-child{margin-left:auto;color:var(--muted)}
svg.chart{width:100%;max-width:100%;height:auto;display:block}
.chart text{font-family:var(--font);fill:var(--muted);font-size:10px}
.chart .axis{stroke:var(--line)}
.chart .b{fill:var(--mid)} .chart .b.today{fill:var(--ink)}
.chart .l1{stroke:var(--ink)} .chart .l2{stroke:var(--mid)}

/* ---------- día ---------- */
.dia-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dia-head .sub{margin-left:auto;text-align:right}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:104px 1fr 30px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;position:relative}
.tl li:last-child{border:0}
.tl .h{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.tl .n{min-width:0}
.tl .n .tiny{display:block}
.tl li.otro .n{color:var(--muted)}
.tl li.past{opacity:.55}
.tl li.now{opacity:1}
.tl li.now::before{content:"";position:absolute;left:-16px;top:6px;bottom:6px;width:3px;background:var(--ink);border-radius:2px}
.tl li.now .h,.tl li.now .n{color:var(--text);font-weight:600}
.tl .cb{margin:0}
.tl .done{width:22px;height:22px;display:grid;place-items:center;color:var(--pos)}
.tl .done svg{width:14px;height:14px}
.edblk{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.edblk:last-of-type{border:0}
.edblk .l1{display:grid;grid-template-columns:96px 96px 1fr;gap:8px}
.edblk .l2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.edblk input.inp{padding:6px 8px}
.dchips{display:flex;gap:4px}
.dchips .chip{padding:3px 0;width:30px;text-align:center;font-size:12px}
.edblk .del{color:var(--muted);padding:2px 6px;margin-left:auto}
.edblk .del:hover{color:var(--neg)}

/* ---------- budget ---------- */
.bud-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:14px}
.line{display:grid;grid-template-columns:1fr 110px;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.line:last-child{border:0}
.line input{padding:6px 8px;border-radius:5px;border:1px solid var(--line);background:var(--paper);width:110px}
.line.sum{font-weight:600;border-top:1px solid var(--mid);border-bottom:0;padding-top:8px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.summary .stat .big{font-size:22px}

/* ---------- investments ---------- */
.form{display:grid;grid-template-columns:150px 1fr 130px 1.4fr auto;gap:8px;align-items:end;margin-top:12px}
.form label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.ops td{font-size:13px}
.ops .del{color:var(--muted);padding:2px 6px}
.ops .del:hover{color:var(--neg)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,18,12,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(420px,100%)}
.modal .actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.pop{position:absolute;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:none;
  grid-template-columns:repeat(5,36px);gap:6px;box-shadow:0 8px 24px rgba(20,18,12,.15)}
.pop.show{display:grid}
.pop button{width:36px;height:36px;border-radius:6px;border:1px solid var(--line)}
.pop button:hover{background:var(--sand)}
.pop button.clear{grid-column:1/-1;width:100%;height:30px;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:70}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .row.c3,.row.c2,.row.c4{grid-template-columns:1fr 1fr}
  .bud-cols{grid-template-columns:1fr}
  .form{grid-template-columns:1fr 1fr}
  .form .btn{grid-column:1/-1}
}
@media (max-width:640px){
  main{padding:16px 14px 90px}
  .top{padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
  .top .tabs{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);z-index:20;
    padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
  .tabbar .tab{flex:1;text-align:center;font-size:13px;padding:9px 4px}
  .row.c3,.row.c2,.row.c4{grid-template-columns:1fr}
  .summary,.stats3{grid-template-columns:1fr 1fr}
  h1{font-size:24px}
  .hgrid .hname{min-width:120px}
  .hgrid tbody .hname button{max-width:120px;font-size:12px}
  .grid-wrap{margin:0 -16px;padding:0 16px}
  .block{padding:14px}
  .hm{display:none}
  .cs{overflow:auto;margin:0 -14px;padding:0 14px}
  .tl li{grid-template-columns:92px 1fr 30px;gap:8px}
  .tl li.now::before{left:-14px}
  .edblk .l1{grid-template-columns:1fr 1fr}
  .edblk .l1 input[data-f="name"]{grid-column:1/-1}
  .cs svg{min-width:560px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Hábitos y finanzas</div>
  <nav class="tabs" id="tabs">
    <button class="tab" data-tab="dia">Día</button>
    <button class="tab" data-tab="hab">Hábitos</button>
    <button class="tab" data-tab="bud">Presupuesto</button>
    <button class="tab" data-tab="inv">Inversiones</button>
  </nav>
  <div class="spacer"></div>
  <span class="syncdot off" id="syncdot" title="Sincronización"></span>
  <button class="icon" id="settings" aria-label="Copia de seguridad"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></button>
  <button class="icon" id="theme" aria-label="Cambiar tema"></button>
</header>
<div class="banner" id="banner">Este navegador no permite guardar datos (por ejemplo, en navegación privada). Los cambios no se conservarán.</div>
<main id="view"><div class="empty">Cargando…</div></main>
<nav class="tabbar" id="tabbar">
  <button class="tab" data-tab="dia">Día</button>
  <button class="tab" data-tab="hab">Hábitos</button>
  <button class="tab" data-tab="bud">Presupuesto</button>
  <button class="tab" data-tab="inv">Inversiones</button>
</nav>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="pop" id="pop"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================== base ============================== */
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS=['lu','ma','mi','ju','vi','sá','do'];

/* ---------- almacenamiento local ---------- */
const PFX='hf_';
const hasStorage=()=>{try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}};
const mem={};
const store={
  async get(k,def){
    if(!hasStorage()) return k in mem?mem[k]:def;
    try{const r=localStorage.getItem(PFX+k);return r?JSON.parse(r):def;}catch(e){return def;}
  },
  async set(k,v){
    mem[k]=v;
    if(!hasStorage()) return false;
    try{localStorage.setItem(PFX+k,JSON.stringify(v));return true;}catch(e){return false;}
  },
  keys(){try{return Object.keys(localStorage).filter(k=>k.startsWith(PFX)).map(k=>k.slice(PFX.length));}catch(e){return Object.keys(mem);}}
};

/* base64 <-> texto con acentos y emojis */
function b64enc(str){const b=new TextEncoder().encode(str);let s='';b.forEach(c=>s+=String.fromCharCode(c));return btoa(s);}
function b64dec(b64){const s=atob(String(b64).replace(/\s/g,''));const a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new TextDecoder().decode(a);}

function syncUI(){
  const d=document.getElementById('syncdot');if(!d)return;
  d.className='syncdot '+SYNC.estado;
  d.title={ok:'Sincronizado con tus otros dispositivos',
    err:'Sin conexión: se guarda aquí y se subirá solo',
    auth:'La llave ya no vale: vuelve a activarla',
    off:'Sincronización sin activar'}[SYNC.estado]||'';
}
async function gh(path,opts={}){
  const t=tok();if(!t)throw new Error('sin llave');
  const r=await fetch(GH.api+path,Object.assign({},opts,{headers:Object.assign({
    Authorization:'Bearer '+t,Accept:'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},opts.headers||{})}));
  if(r.status===401||r.status===403){SYNC.estado='auth';syncUI();throw new Error('llave rechazada');}
  return r;
}
async function activar(token){
  token=String(token||'').trim();
  if(!token)throw new Error('Pega la llave');
  const r=await fetch(GH.api+'/user',{headers:{Authorization:'Bearer '+token,
    Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
  if(!r.ok)throw new Error('La llave no es válida o ha caducado');
  const u=await r.json();
  const r2=await fetch(GH.api+'/repos/'+u.login+'/'+GH.repo,{headers:{Authorization:'Bearer '+token,
    Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
  if(!r2.ok)throw new Error('No encuentro el repositorio "'+GH.repo+'" en tu cuenta '+u.login);
  jset(TOKK,token);jset(OWNK,u.login);
  return u.login;
}
function desactivar(){jset(TOKK,null);jset(SHAK,null);SYNC.estado='off';syncUI();}

/* --- leer el archivo de datos de GitHub --- */
async function leerNube(){
  const r=await gh('/repos/'+own()+'/'+GH.repo+'/contents/'+GH.path+'?ref=HEAD&t='+Date.now());
  if(r.status===404){jset(SHAK,null);return {sha:null,datos:{}};}
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  jset(SHAK,j.sha);
  let datos={};
  try{datos=JSON.parse(b64dec(j.content))||{};}catch(e){datos={};}
  return {sha:j.sha,datos:datos};
}
async function escribirNube(datos,sha,intento){
  const cuerpo={message:'Datos '+new Date().toISOString(),content:b64enc(JSON.stringify(datos))};
  if(sha)cuerpo.sha=sha;
  const r=await gh('/repos/'+own()+'/'+GH.repo+'/contents/'+GH.path,{method:'PUT',body:JSON.stringify(cuerpo)});
  if(r.status===409||r.status===422){
    if(intento)throw new Error('conflicto');
    const n=await leerNube();
    return escribirNube(mezclar(datos,n.datos),n.sha,true);
  }
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(j&&j.content)jset(SHAK,j.content.sha);
  return true;
}
/* une dos mapas {clave:{ts,v}} quedándose con lo más reciente */
function mezclar(a,b){
  const out=Object.assign({},a);
  Object.keys(b||{}).forEach(k=>{if(!out[k]||(+b[k].ts||0)>(+out[k].ts||0))out[k]=b[k];});
  return out;
}
function applyRemote(k,v){
  if(k==='cfg'){S.cfg=v;applyTheme();}
  else if(k==='hab_cfg')S.hab=v;
  else if(k==='hor_cfg')S.hor=v;
  else if(k==='inv_idx')S.idx=v;
  else if(k==='inv_trd')S.trd=v;
  else if(k.slice(0,4)==='hab_')S.months[k.slice(4)]=v;
  else if(k.slice(0,4)==='bud_')S.bud[k.slice(4)]=v;
}
let rrT=null;
function scheduleRerender(){
  clearTimeout(rrT);
  rrT=setTimeout(()=>{
    const a=document.activeElement;
    if((a&&(a.tagName==='INPUT'||a.tagName==='SELECT'))||document.getElementById('overlay').classList.contains('show')){scheduleRerender();return;}
    render();toast('Actualizado desde otro dispositivo');
  },900);
}
/* baja lo nuevo de la nube al dispositivo */
async function pullAll(repintar){
  if(!tok())return;
  try{
    const {datos}=await leerNube();
    const ch=[];
    Object.keys(datos).forEach(k=>{
      const ts=+datos[k].ts||0;
      if(ts<=(SYNC.ts[k]||0))return;
      SYNC.ts[k]=ts;mem[k]=datos[k].v;
      try{localStorage.setItem(PFX+k,JSON.stringify(datos[k].v));}catch(e){}
      ch.push(k);
    });
    SYNC.estado='ok';
    if(ch.length){saveTs();if(repintar){ch.forEach(k=>applyRemote(k,mem[k]));scheduleRerender();}}
  }catch(e){if(SYNC.estado!=='auth')SYNC.estado='err';}
  syncUI();
}
/* sube todo lo local (agrupado, no un archivo por cambio) */
async function subir(){
  if(!tok()||SYNC.ocupado){SYNC.sucio=true;return;}
  SYNC.ocupado=true;SYNC.sucio=false;
  try{
    const remoto=await leerNube();
    const local={};
    for(const k of store.keys())local[k]={ts:SYNC.ts[k]||0,v:await store.get(k,null)};
    const fin=mezclar(local,remoto.datos);
    /* lo que la nube tenía más nuevo, aplícalo también aquí */
    const ch=[];
    Object.keys(fin).forEach(k=>{
      const ts=+fin[k].ts||0;
      if(ts>(SYNC.ts[k]||0)){SYNC.ts[k]=ts;mem[k]=fin[k].v;
        try{localStorage.setItem(PFX+k,JSON.stringify(fin[k].v));}catch(e){}ch.push(k);}
    });
    await escribirNube(fin,remoto.sha,false);
    saveTs();SYNC.estado='ok';
    if(ch.length){ch.forEach(k=>applyRemote(k,mem[k]));scheduleRerender();}
  }catch(e){if(SYNC.estado!=='auth')SYNC.estado='err';SYNC.sucio=true;}
  SYNC.ocupado=false;syncUI();
  if(SYNC.sucio)setTimeout(subir,4000);
}
function subirLuego(){clearTimeout(SYNC.timer);SYNC.timer=setTimeout(subir,2000);}
async function borrarNube(){
  if(!tok())return;
  try{const r=await leerNube();await escribirNube({},r.sha,false);}catch(e){}
}
async function initSync(){
  SYNC.ts=jget(TSK)||{};
  if(!tok()||!own()){SYNC.estado='off';syncUI();return;}
  await pullAll(false);
}
function arrancarSync(){
  const tick=()=>{if(!document.hidden&&tok()){if(SYNC.sucio)subir();else pullAll(true);}};
  setInterval(tick,30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
  window.addEventListener('online',tick);
  window.addEventListener('focus',tick);
}

async function exportAll(){
  const data={app:'habitos-finanzas',v:1,fecha:new Date().toISOString(),datos:{}};
  for(const k of store.keys())data.datos[k]=await store.get(k,null);
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='habitos-finanzas-'+TODAY+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  toast('Copia exportada');
}
function importAll(file){
  const rd=new FileReader();
  rd.onload=async()=>{try{
    const j=JSON.parse(rd.result);
    if(!j||j.app!=='habitos-finanzas'||!j.datos)throw 0;
    if(!confirm('Se sustituirán los datos actuales'+(tok()?', también en tus otros dispositivos':'')+'. ¿Continuar?'))return;
    store.keys().forEach(k=>{try{localStorage.removeItem(PFX+k);}catch(e){}delete mem[k];});
    const ts=Date.now();SYNC.ts={};
    Object.entries(j.datos).forEach(([k,v])=>{mem[k]=v;SYNC.ts[k]=ts;
      try{localStorage.setItem(PFX+k,JSON.stringify(v));}catch(e){}});
    saveTs();
    if(tok()){toast('Importando…');await borrarNube();await subir();}
    location.reload();
  }catch(e){toast('Ese archivo no es una copia válida');}};
  rd.readAsText(file);
}

/* ============================== gráficos ============================== */
function barChart(vals,labels,opts={}){
  const {max=1,fmt=v=>pct(v),hl=-1,step=22,h=150}=opts;
  const n=vals.length,L=34,B=22,T=8,W=L+n*step+6,H=h;
  const y=v=>T+(H-T-B)*(1-Math.min(v,max)/max);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  [0,.25,.5,.75,1].forEach(f=>{const yy=y(f*max);s+=`<line class="axis" x1="${L}" x2="${W-4}" y1="${yy}" y2="${yy}"/><text x="${L-5}" y="${yy+3}" text-anchor="end">${fmt(f*max)}</text>`;});
  vals.forEach((v,i)=>{
    const x=L+i*step+3,bw=step-6;
    if(v!=null&&v>0)s+=`<rect class="b${i===hl?' today':''}" x="${x}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="2"/>`;
    const lab=labels[i];if(lab!=null&&(n<=12||i%2===0))s+=`<text x="${x+bw/2}" y="${H-7}" text-anchor="middle">${esc(lab)}</text>`;
  });
  return '<div class="cs">'+s+'</svg></div>';
}
function groupedBars(series,labels,opts={}){
  // series: [{vals,cls}], same length
  const n=labels.length,k=series.length,step=Math.max(30,k*10+10),L=44,B=22,T=8,W=L+n*step+6,H=opts.h||170;
  const max=Math.max(1,...series.flatMap(s=>s.vals))*1.08;
  const y=v=>T+(H-T-B)*(1-v/max);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  [0,.5,1].forEach(f=>{const yy=y(f*max);s+=`<line class="axis" x1="${L}" x2="${W-4}" y1="${yy}" y2="${yy}"/><text x="${L-5}" y="${yy+3}" text-anchor="end">${Math.round(f*max)}</text>`;});
  const bw=(step-8)/k;
  labels.forEach((lab,i)=>{
    series.forEach((se,j)=>{const v=se.vals[i]||0;const x=L+i*step+4+j*bw;
      if(v>0)s+=`<rect x="${x}" y="${y(v)}" width="${bw-1.5}" height="${y(0)-y(v)}" rx="1.5" fill="${se.color}"/>`;});
    s+=`<text x="${L+i*step+step/2}" y="${H-7}" text-anchor="middle">${esc(lab)}</text>`;
  });
  return '<div class="cs">'+s+'</svg></div>';
}
function donut(done,left){
  const tot=done+left,r=44,c=2*Math.PI*r,fd=tot?done/tot:0;
  return `<svg viewBox="0 0 120 120" width="108" height="108" style="flex:none">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--sand)" stroke-width="16"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--ink)" stroke-width="16" stroke-dasharray="${c*fd} ${c}" transform="rotate(-90 60 60)" style="transition:stroke-dasharray .4s"/>
    <text x="60" y="65" text-anchor="middle" style="font-size:18px;font-weight:600;fill:var(--text)">${pct(fd)}</text></svg>`;
}
function nice(v){if(v===0)return 0;const e=Math.pow(10,Math.floor(Math.log10(Math.abs(v))));const m=Math.abs(v)/e;const k=m<=1?1:m<=2?2:m<=5?5:10;return Math.sign(v)*k*e;}
function lineChart(series,labels,opts={}){
  let {min=0,max=10,h=150,step=22,fmt=v=>v,money=false,minW=480}=opts;
  if(money){max=nice(max);min=min<0?-nice(-min):0;if(max===min)max=min+1;}
  const n=labels.length,L=money?44:34,B=22,T=8,W=Math.max(minW,L+n*step+6),H=h,st=(W-L-6)/n;
  const y=v=>T+(H-T-B)*(1-(v-min)/(max-min));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  const ticks=money?[...new Set([min,0,max])].sort((a,b)=>a-b):[min,(min+max)/2,max];
  ticks.forEach(v=>{const yy=y(v);s+=`<line class="axis" x1="${L}" x2="${W-4}" y1="${yy}" y2="${yy}"/><text x="${L-5}" y="${yy+3}" text-anchor="end">${fmt(v)}</text>`;});
  series.forEach(se=>{
    let d='',open=false;
    se.vals.forEach((v,i)=>{if(v==null){open=false;return;}const x=L+i*st+st/2;d+=(open?'L':'M')+x+' '+y(v)+' ';open=true;});
    s+=`<path class="${se.cls}" d="${d}" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    se.vals.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${L+i*st+st/2}" cy="${y(v)}" r="2.2" fill="${se.cls==='l1'?'var(--ink)':'var(--mid)'}"/>`;});
  });
  const every=Math.ceil(n/Math.floor((W-L)/34));
  labels.forEach((lab,i)=>{if(i%every===0)s+=`<text x="${L+i*st+st/2}" y="${H-7}" text-anchor="middle">${esc(lab)}</text>`;});
  return '<div class="cs">'+s+'</svg></div>';
}

async function loadMonth(y,m){
  const k=mkey(y,m);
  if(!S.months[k])S.months[k]=await store.get('hab_'+k,null)||{checks:{},mood:[],mot:[],test:[]};
  if(!S.months[k].test)S.months[k].test=[];
  return S.months[k];
}
const curMonth=()=>S.months[mkey(S.y,S.m)];
function checks(md,id){if(!md.checks[id])md.checks[id]=[];return md.checks[id];}
function saveMonth(){const k=mkey(S.y,S.m);save('hab_'+k,S.months[k]);}

function habStats(){
  const md=curMonth(),n=daysIn(S.y,S.m),H=S.hab.habits,nh=H.length;
  const wd=[];for(let d=0;d<n;d++)wd.push(dow(S.y,S.m,d+1));
  const per=H.map(h=>{
    const c=checks(md,h.id);let real=0,obj=0;
    for(let d=0;d<n;d++){if(!habOn(h,wd[d]))continue;obj++;if(c[d])real++;}
    // racha hasta hoy (o hasta fin de mes si es un mes pasado); los días en que el hábito no cuenta se saltan
    const isCur=S.y===NOW.getFullYear()&&S.m===NOW.getMonth();
    let end=isCur?NOW.getDate()-1:(new Date(S.y,S.m,1)<NOW?n-1:-1);let streak=0;
    for(let d=end;d>=0;d--){if(!habOn(h,wd[d]))continue;if(c[d])streak++;else if(d===end&&isCur){continue;}else break;}
    return {h,real,obj,left:obj-real,p:obj?real/obj:0,streak};
  });
  const daily=[];for(let d=0;d<n;d++){let k=0,a=0;H.forEach(h=>{if(!habOn(h,wd[d]))return;a++;if(checks(md,h.id)[d])k++;});daily.push(a?k/a:0);}
  const weeks=[[0,6],[7,13],[14,20],[21,27],[28,n-1]].filter(w=>w[0]<n).map(w=>{
    const days=Math.min(w[1],n-1)-w[0]+1;let k=0;for(let d=w[0];d<=Math.min(w[1],n-1);d++)k+=daily[d];return days?k/days:0;});
  const completed=per.reduce((a,b)=>a+b.real,0),goal=per.reduce((a,b)=>a+b.obj,0);
  const top=[...per].sort((a,b)=>b.real-a.real).slice(0,10);
  return {per,daily,weeks,completed,goal,left:goal-completed,n,top};
}

function todayHTML(){

  const f=H.length?k/H.length:0,r=24,c=2*Math.PI*r;

  else if(a==='dnext'){S.diaOff++;render();}
  else if(a==='dhoy'){S.diaOff=0;render();}
  else if(a==='dtog'){
    const k=mkey(NOW.getFullYear(),NOW.getMonth()),md=S.months[k],c=checks(md,b.dataset.h),d=NOW.getDate()-1;
    c[d]=!c[d];save('hab_'+k,md);refreshDia();

  else if(a==='budsub'){S.budSub=b.dataset.v;render();}

const tmin=t=>{const [h,m]=String(t||'0:0').split(':').map(Number);return h*60+m;};
const fmtH=min=>{const h=Math.floor(min/60),m=min%60;return h+' h'+(m?' '+pad(m):'');};
function viewedDay(){const dt=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()+S.diaOff);return {dt,w:(dt.getDay()+6)%7,isToday:S.diaOff===0};}
function dayBlocks(w){return S.hor.blocks.filter(b=>b.days&&b.days.includes(w)).sort((a,b)=>tmin(a.ini)-tmin(b.ini)||tmin(a.fin)-tmin(b.fin));}
function todayChecks(){return S.months[mkey(NOW.getFullYear(),NOW.getMonth())];}
function cargarRutina(conHabitos){
  const msg=conHabitos
    ?'Se cargará el horario de la rutina y los 10 hábitos. Los hábitos actuales que no estén en esa lista dejarán de mostrarse (sus marcas no se borran). ¿Continuar?'
    :'Se sustituirá el horario actual por el de la rutina base. Los hábitos no cambian. ¿Continuar?';
  if(!confirm(msg))return;
  if(conHabitos){
    const H=S.hab.habits;
    S.hab={habits:DEFAULT_HABITS.map(t=>{const ex=H.find(h=>h.name.trim().toLowerCase()===t.name.toLowerCase());
      return ex?Object.assign(ex,{days:t.days.slice()}):{id:uid(),name:t.name,days:t.days.slice()};})};
    save('hab_cfg',S.hab);
  }
  const byName=n=>{const h=S.hab.habits.find(h=>h.name.trim().toLowerCase()===String(n||'').toLowerCase());return h?h.id:'';};
  S.hor={blocks:DEFAULT_SCHEDULE.map(b=>({id:uid(),ini:b.ini,fin:b.fin,name:b.name,days:b.days.slice(),hab:b.hab?byName(b.hab):'',tipo:b.tipo}))};
  save('hor_cfg',S.hor);S.horEdit=false;render();toast('Rutina cargada');
}
function tlHTML(){
  const {w,isToday}=viewedDay(),bl=dayBlocks(w),md=todayChecks(),d=NOW.getDate()-1;
  const N=new Date(),now=N.getHours()*60+N.getMinutes();
  if(!bl.length)return '<div class="empty">Nada programado este día.</div>';
  const hid=id=>S.hab.habits.find(h=>h.id===id);
  return '<ul class="tl">'+bl.map(b=>{
    const i=tmin(b.ini),f=Math.max(tmin(b.fin),i),hito=f===i,end=hito?i+30:f;
    const h=b.hab?hid(b.hab):null,on=!!(h&&md&&checks(md,h.id)[d]);
    let st='';if(isToday){if(now>=i&&now<end)st=' now';else if(now>=end)st=' past';}
    const right=!h?'':isToday?`<button class="cb${on?' on':''}" data-act="dtog" data-h="${h.id}" aria-pressed="${on}" aria-label="${esc(h.name)}">${CHECK}</button>`:'';
    return `<li class="${b.tipo==='opo'?'opo':'otro'}${st}"><span class="h">${b.ini}${hito?'':'–'+b.fin}</span><span class="n">${esc(b.name)||'<i>sin nombre</i>'}${h&&h.name!==b.name?`<span class="tiny">${esc(h.name)}</span>`:''}</span>${right}</li>`;
  }).join('')+'</ul>';
}
function diaHeadHTML(){
  const {dt,w,isToday}=viewedDay(),bl=dayBlocks(w),md=todayChecks(),d=NOW.getDate()-1;
  const hid=id=>S.hab.habits.find(h=>h.id===id);
  let opo=0,opoOk=0,nh=0,kh=0;
  bl.forEach(b=>{const dur=Math.max(0,tmin(b.fin)-tmin(b.ini));if(b.tipo==='opo')opo+=dur;
    const h=b.hab?hid(b.hab):null;if(!h)return;const on=!!(md&&checks(md,h.id)[d]);
    if(b.tipo==='opo'&&on)opoOk+=dur;});
  const HH=S.hab.habits.filter(h=>habOn(h,w));nh=HH.length;if(isToday&&md)HH.forEach(h=>{if(checks(md,h.id)[d])kh++;});
  const fecha=`${DIAS_L[w]} ${dt.getDate()} de ${MESES[dt.getMonth()].toLowerCase()}`;
  const linea=[opo?`Oposición: ${fmtH(opo)}${isToday&&opoOk?` · hechas ${fmtH(opoOk)}`:''}`:'',nh?(isToday?`Hábitos: ${kh} de ${nh}`:`${nh} hábitos cuentan`):''].filter(Boolean).join(' · ');
  return `<h1>${isToday?'Hoy':S.diaOff===1?'Mañana':S.diaOff===-1?'Ayer':DIAS_L[w][0].toUpperCase()+DIAS_L[w].slice(1)}</h1>
  <div class="monthnav"><button class="icon" data-act="dprev" aria-label="Día anterior">‹</button>${isToday?'':'<button class="btn small" data-act="dhoy">Hoy</button>'}<button class="icon" data-act="dnext" aria-label="Día siguiente">›</button></div>
  <div class="sub"><div class="tiny">${fecha}</div><div style="font-weight:600">${linea||'Sin horario'}</div></div>`;
}
function edHTML(){
  const opts=sel=>'<option value="">Sin hábito</option>'+S.hab.habits.map(h=>`<option value="${h.id}"${h.id===sel?' selected':''}>${esc(h.name)}</option>`).join('');
  const bl=[...S.hor.blocks].sort((a,b)=>Math.min(...a.days,9)-Math.min(...b.days,9)||tmin(a.ini)-tmin(b.ini));
  return `<div class="block" style="margin-top:14px" id="horEd"><div class="head"><h2>Horario</h2><span class="tiny">los cambios se guardan solos</span></div>
  ${bl.map(b=>`<div class="edblk" data-id="${b.id}">
    <div class="l1"><input class="inp" type="time" data-f="ini" value="${b.ini}" aria-label="Inicio"><input class="inp" type="time" data-f="fin" value="${b.fin}" aria-label="Fin"><input class="inp" data-f="name" value="${esc(b.name)}" placeholder="Qué toca" maxlength="60"></div>
    <div class="l2"><span class="chips dchips">${DIAS.map((d,i)=>`<button class="chip${b.days.includes(i)?' on':''}" data-act="bday" data-id="${b.id}" data-d="${i}">${d}</button>`).join('')}</span>
      <select class="sel" data-f="hab" aria-label="Hábito enlazado">${opts(b.hab)}</select>
      <select class="sel" data-f="tipo" aria-label="Tipo"><option value="opo"${b.tipo==='opo'?' selected':''}>Oposición</option><option value="otro"${b.tipo!=='opo'?' selected':''}>Otro</option></select>
      <button class="del" data-act="bdel" data-id="${b.id}" aria-label="Quitar bloque">✕</button></div>
  </div>`).join('')}
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" data-act="badd">+ Añadir bloque</button><span class="spacer"></span><button class="btn" data-act="horbase">Volver al horario base</button></div>
  </div>`;
}
function diaView(){
  if(!S.hor.blocks.length)return `<div class="dia-head">${diaHeadHTML()}</div>
    <div class="block" style="margin-top:16px"><h2>Todavía no hay horario</h2>
    <p class="tiny" style="margin:8px 0 12px">Carga la rutina acordada: horario de lunes a domingo y los 10 hábitos, con los días en que cuenta cada uno. Luego puedes editar cualquier bloque.</p>
    <button class="btn primary" data-act="hortpl">Cargar la rutina</button></div>`;
  return `<div class="dia-head">${diaHeadHTML()}</div>
  <div class="block" style="margin-top:16px"><div id="diaTl">${tlHTML()}</div>
    <button class="addhab" data-act="horedit">${S.horEdit?'Cerrar el editor':'Editar horario'}</button></div>
  ${S.horEdit?edHTML():''}`;
}
function refreshDia(){const t=$('#diaTl');if(t)t.innerHTML=tlHTML();const h=$('.dia-head');if(h)h.innerHTML=diaHeadHTML();}
document.addEventListener('change',e=>{
  const inp=e.target.closest('#horEd [data-f]');if(!inp)return;
  const bl=S.hor.blocks.find(x=>x.id===inp.closest('.edblk').dataset.id);if(!bl)return;
  bl[inp.dataset.f]=inp.value;save('hor_cfg',S.hor);refreshDia();
});
setInterval(()=>{if(S.tab==='dia'&&!S.horEdit&&!$('#overlay').classList.contains('show'))refreshDia();},60000);

/* ============================== PRESUPUESTO ============================== */
async function loadBud(Y){
  if(!S.bud[Y])S.bud[Y]=await store.get('bud_'+Y,null)||{m:Array.from({length:12},()=>({ing:{},gas:{},aho:{}}))};
}
const fiscal=i=>({m:(6+i)%12,y:i<6?S.budY:S.budY+1});
const sum=o=>Object.values(o).reduce((a,b)=>a+(+b||0),0);
function budTotals(i){const d=S.bud[S.budY].m[i];const ing=sum(d.ing),gas=sum(d.gas),aho=sum(d.aho);return {ing,gas,aho,bal:ing-gas-aho};}
function budView(){
  const yOpts=[];for(let y=S.budY-2;y<=S.budY+2;y++)yOpts.push(`<option value="${y}"${y===S.budY?' selected':''}>${y}–${String(y+1).slice(2)}</option>`);
  let s=`<div class="hab-head"><h1>Presupuesto</h1><select class="sel" id="budY">${yOpts.join('')}</select>
    <div class="chips" style="margin-left:auto"><button class="chip${S.budSub==='mes'?' on':''}" data-act="budsub" data-v="mes">Mes</button><button class="chip${S.budSub==='ano'?' on':''}" data-act="budsub" data-v="ano">Año</button></div></div>`;
  if(S.budSub==='mes'){
    const f=fiscal(S.budM),t=budTotals(S.budM),d=S.bud[S.budY].m[S.budM];
    s+=`<div class="chips" style="margin-top:14px">${Array.from({length:12},(_,i)=>{const g=fiscal(i);return `<button class="chip${i===S.budM?' on':''}" data-act="budm" data-v="${i}">${MES3[g.m]}</button>`;}).join('')}</div>
    <div class="summary">
      <div class="stat"><div class="tiny">Ingresos</div><div class="big num" id="tIng">${eur(t.ing)}</div></div>
      <div class="stat"><div class="tiny">Gastos</div><div class="big num" id="tGas">${eur(t.gas)}</div></div>
      <div class="stat"><div class="tiny">Ahorros</div><div class="big num" id="tAho">${eur(t.aho)}</div></div>
      <div class="stat"><div class="tiny">Balance</div><div class="big num ${cls(t.bal)}" id="tBal">${eur(t.bal)}</div><div class="tiny" id="tRate">${t.ing?'ahorras el '+pct(t.aho/t.ing):''}</div></div>
    </div>
    <div class="bud-cols">${col('Ingresos','ing',ING,d)}${col('Gastos','gas',GAS,d)}${col('Ahorros','aho',AHO,d)}</div>`;
  }else{
    const T=Array.from({length:12},(_,i)=>budTotals(i));
    const tot=T.reduce((a,b)=>({ing:a.ing+b.ing,gas:a.gas+b.gas,aho:a.aho+b.aho,bal:a.bal+b.bal}),{ing:0,gas:0,aho:0,bal:0});
    const cat={};GAS.forEach(c=>cat[c]=0);S.bud[S.budY].m.forEach(d=>GAS.forEach(c=>cat[c]+=+d.gas[c]||0));
    s+=`<div class="summary">
      <div class="stat"><div class="tiny">Ingresos del año</div><div class="big num">${eur(tot.ing)}</div></div>
      <div class="stat"><div class="tiny">Gastos del año</div><div class="big num">${eur(tot.gas)}</div></div>
      <div class="stat"><div class="tiny">Ahorros del año</div><div class="big num">${eur(tot.aho)}</div><div class="tiny">${tot.ing?pct(tot.aho/tot.ing)+' de los ingresos':''}</div></div>
      <div class="stat"><div class="tiny">Balance</div><div class="big num ${cls(tot.bal)}">${eur(tot.bal)}</div></div></div>
    <div class="block" style="margin-top:14px"><div class="head"><h2>Julio ${S.budY} – junio ${S.budY+1}</h2></div>
      ${groupedBars([{vals:T.map(t=>t.ing),color:'var(--ink)'},{vals:T.map(t=>t.gas),color:'var(--mid)'},{vals:T.map(t=>t.aho),color:'var(--sand)'}],Array.from({length:12},(_,i)=>MES3[fiscal(i).m]))}
      <div class="legend" style="margin-top:4px"><b style="background:var(--ink)"></b>Ingresos &nbsp; <b style="background:var(--mid)"></b>Gastos &nbsp; <b style="background:var(--sand)"></b>Ahorros</div></div>
    <div class="row c2">
      <div class="block"><div class="head"><h2>Resumen mensual</h2></div><div style="overflow:auto"><table><thead><tr><th>Mes</th><th class="r">Ingresos</th><th class="r">Gastos</th><th class="r">Ahorros</th><th class="r">Balance</th></tr></thead><tbody>
        ${T.map((t,i)=>`<tr><td>${MES3[fiscal(i).m]} ${String(fiscal(i).y).slice(2)}</td><td class="r num">${eur(t.ing)}</td><td class="r num">${eur(t.gas)}</td><td class="r num">${eur(t.aho)}</td><td class="r num ${cls(t.bal)}">${eur(t.bal)}</td></tr>`).join('')}
        <tr class="total"><td>Total</td><td class="r num">${eur(tot.ing)}</td><td class="r num">${eur(tot.gas)}</td><td class="r num">${eur(tot.aho)}</td><td class="r num ${cls(tot.bal)}">${eur(tot.bal)}</td></tr></tbody></table></div></div>
      <div class="block"><div class="head"><h2>Gastos por categoría</h2></div><table><tbody>
        ${GAS.map(c=>`<tr><td>${c}</td><td style="width:35%"><div class="bar"><i style="width:${tot.gas?cat[c]/tot.gas*100:0}%"></i></div></td><td class="r num">${eur(cat[c])}</td></tr>`).join('')}
      </tbody></table></div>
    </div>`;
  }
  return s;
  function col(title,g,cats,d){
    return `<div class="block"><div class="head"><h2>${title}</h2><span class="tiny num" id="c_${g}">${eur(sum(d[g]))}</span></div>
      ${cats.map(c=>`<div class="line"><span>${c}</span><input type="number" step="0.01" inputmode="decimal" placeholder="0" data-g="${g}" data-c="${esc(c)}" value="${d[g][c]??''}"></div>`).join('')}</div>`;
  }
}
document.addEventListener('input',e=>{
  const i=e.target;if(!i.matches('input[data-g]'))return;
  const d=S.bud[S.budY].m[S.budM];const v=i.value===''?null:+i.value;
  if(v==null)delete d[i.dataset.g][i.dataset.c];else d[i.dataset.g][i.dataset.c]=v;
  save('bud_'+S.budY,S.bud[S.budY]);
  const t=budTotals(S.budM);
  $('#tIng').textContent=eur(t.ing);$('#tGas').textContent=eur(t.gas);$('#tAho').textContent=eur(t.aho);
  const b=$('#tBal');b.textContent=eur(t.bal);b.className='big num '+cls(t.bal);
  $('#tRate').textContent=t.ing?'ahorras el '+pct(t.aho/t.ing):'';
  $('#c_'+i.dataset.g).textContent=eur(sum(d[i.dataset.g]));
});
document.addEventListener('change',async e=>{
  if(e.target.id==='budY'){S.budY=+e.target.value;await loadBud(S.budY);render();}
  if(e.target.id==='idxY'){S.idxY=+e.target.value;render();}
});

/* ============================== INVERSIONES ============================== */
function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function invView(){
  let s=`<div class="hab-head"><h1>Inversiones</h1>
    <div class="chips" style="margin-left:auto"><button class="chip${S.invSub==='idx'?' on':''}" data-act="invsub" data-v="idx">Indexados</button><button class="chip${S.invSub==='trd'?' on':''}" data-act="invsub" data-v="trd">Trading</button></div></div>`;
  return s+(S.invSub==='idx'?idxView():trdView());
}
/* --- fondo indexado: aportaciones mensuales --- */
function idxView(){
  const Y=S.idxY??S.budY;S.idxY=Y;
  const yOpts=[];for(let y=Y-2;y<=Y+2;y++)yOpts.push(`<option value="${y}"${y===Y?' selected':''}>${y}–${String(y+1).slice(2)}</option>`);
  const keys=Object.keys(S.idx.aport).filter(k=>+S.idx.aport[k]).sort();
  const total=keys.reduce((a,k)=>a+(+S.idx.aport[k]),0);
  const yearKeys=Array.from({length:12},(_,i)=>{const m=(6+i)%12,y=i<6?Y:Y+1;return mkey(y,m);});
  const yearTot=yearKeys.reduce((a,k)=>a+(+S.idx.aport[k]||0),0);
  const months=yearKeys.filter(k=>+S.idx.aport[k]).length;
  const valor=S.idx.valor;const gan=valor!=null?valor-total:null;
  // acumulado histórico
  let acc=0;const accVals=keys.map(k=>acc+= +S.idx.aport[k]);
  const accLabels=keys.map(k=>MES3[+k.slice(5)-1]+' '+k.slice(2,4));
  return `
  <div class="summary" style="grid-template-columns:repeat(4,1fr)">
    <div class="stat"><div class="tiny">Aportado este ejercicio</div><div class="big num">${eur(yearTot)}</div><div class="tiny">${months} de 12 meses</div></div>
    <div class="stat"><div class="tiny">Aportado en total</div><div class="big num">${eur(total)}</div><div class="tiny">${keys.length?'desde '+accLabels[0]:'todavía nada'}</div></div>
    <div class="stat"><div class="tiny">Valor actual de la cartera</div><input class="inp num" type="number" step="0.01" inputmode="decimal" id="idxValor" placeholder="0" value="${valor??''}" style="margin-top:4px"></div>
    <div class="stat"><div class="tiny">Ganancia</div><div class="big num ${gan==null?'':cls(gan)}" id="idxGan">${gan==null?'–':eurS(gan)}</div><div class="tiny" id="idxGanP">${gan!=null&&total?pct(gan/total):''}</div></div>
  </div>
  <div class="row c2">
    <div class="block"><div class="head"><h2>Aportaciones</h2><select class="sel" id="idxY">${yOpts.join('')}</select></div>
      ${yearKeys.map(k=>{const m=+k.slice(5)-1;return `<div class="line"><span>${MESES[m]} ${k.slice(0,4)}</span><input type="number" step="0.01" inputmode="decimal" placeholder="0" data-idx="${k}" value="${S.idx.aport[k]??''}"></div>`;}).join('')}
      <div class="line sum"><span>Total del ejercicio</span><span class="num" id="idxYearTot">${eur(yearTot)}</span></div></div>
    <div class="block"><div class="head"><h2>Capital aportado</h2><span class="tiny">acumulado</span></div>
      ${keys.length?lineChart([{vals:accVals,cls:'l1'}],accLabels,{min:0,max:Math.max(100,acc*1.1),money:true,fmt:v=>eur(v)}):'<div class="empty">Registra tu primera aportación y verás la curva.</div>'}
    </div>
  </div>`;
}
document.addEventListener('input',e=>{
  const i=e.target;
  if(i.matches('input[data-idx]')){
    const v=i.value===''?null:+i.value;if(v==null)delete S.idx.aport[i.dataset.idx];else S.idx.aport[i.dataset.idx]=v;
    save('inv_idx',S.idx);
    const Y=S.idxY;const yk=Array.from({length:12},(_,k)=>mkey(k<6?Y:Y+1,(6+k)%12));
    $('#idxYearTot').textContent=eur(yk.reduce((a,k)=>a+(+S.idx.aport[k]||0),0));
  }
  if(i.id==='idxValor'){
    S.idx.valor=i.value===''?null:+i.value;save('inv_idx',S.idx);
    const total=Object.values(S.idx.aport).reduce((a,b)=>a+(+b||0),0);const gan=S.idx.valor==null?null:S.idx.valor-total;
    const g=$('#idxGan');g.textContent=gan==null?'–':eurS(gan);g.className='big num '+(gan==null?'':cls(gan));
    $('#idxGanP').textContent=gan!=null&&total?pct(gan/total):'';
  }
});
document.addEventListener('focusout',e=>{if(e.target.matches('input[data-idx]')||e.target.id==='idxValor')render();});

/* --- trading --- */
function trdView(){
  const ops=[...S.trd.ops].sort((a,b)=>b.f.localeCompare(a.f)||(b.t||0)-(a.t||0));
  const ws=isoDate(weekStart(NOW)),ms=TODAY.slice(0,7);
  const inW=ops.filter(o=>o.f>=ws),inM=ops.filter(o=>o.f.startsWith(ms));
  const tot=ops.reduce((a,o)=>a+o.r,0),wins=ops.filter(o=>o.r>0).length;
  const sumOf=a=>a.reduce((x,o)=>x+o.r,0);
  // últimas 8 semanas
  const weeks=[];for(let i=7;i>=0;i--){const st=weekStart(NOW);st.setDate(st.getDate()-7*i);const en=new Date(st);en.setDate(en.getDate()+6);
    const a=isoDate(st),b=isoDate(en);const o=ops.filter(x=>x.f>=a&&x.f<=b);weeks.push({a,st,n:o.length,r:sumOf(o)});}
  // acumulado
  const asc=[...ops].sort((a,b)=>a.f.localeCompare(b.f)||(a.t||0)-(b.t||0));let acc=0;const accVals=asc.map(o=>acc+=o.r);
  const lo=Math.min(0,...accVals),hi=Math.max(0,...accVals);
  return `
  <div class="summary">
    <div class="stat"><div class="tiny">Esta semana</div><div class="big num ${cls(sumOf(inW))}">${eurS(sumOf(inW))}</div><div class="tiny">${inW.length} operaciones</div></div>
    <div class="stat"><div class="tiny">Este mes</div><div class="big num ${cls(sumOf(inM))}">${eurS(sumOf(inM))}</div><div class="tiny">${inM.length} operaciones</div></div>
    <div class="stat"><div class="tiny">Resultado total</div><div class="big num ${cls(tot)}">${eurS(tot)}</div><div class="tiny">${ops.length} operaciones</div></div>
    <div class="stat"><div class="tiny">Acierto</div><div class="big num">${ops.length?pct(wins/ops.length):'–'}</div><div class="tiny">${ops.length?wins+' ganadoras':''}</div></div>
  </div>
  <div class="block" style="margin-top:14px"><div class="head"><h2>Nueva operación</h2></div>
    <div class="form">
      <div><label>Fecha</label><input class="inp" type="date" id="opF" value="${TODAY}"></div>
      <div><label>Activo</label><input class="inp" id="opA" placeholder="p. ej. NVDA, BTC, DAX"></div>
      <div><label>Resultado (€)</label><input class="inp" type="number" step="0.01" inputmode="decimal" id="opR" placeholder="+120 o -45"></div>
      <div><label>Nota</label><input class="inp" id="opN" placeholder="opcional"></div>
      <button class="btn primary" id="opAdd">Añadir</button>
    </div></div>
  <div class="row c2">
    <div class="block"><div class="head"><h2>Resultado acumulado</h2></div>
      ${asc.length?lineChart([{vals:accVals,cls:'l1'}],asc.map(o=>o.f.slice(8)+'/'+o.f.slice(5,7)),{min:Math.min(lo*1.1,0),max:Math.max(hi*1.1,1),money:true,fmt:v=>eur(v)}):'<div class="empty">Añade tu primera operación.</div>'}
    </div>
    <div class="block"><div class="head"><h2>Por semanas</h2><span class="tiny">últimas 8</span></div>
      <table><thead><tr><th>Semana del</th><th class="r">Ops</th><th class="r">Resultado</th></tr></thead><tbody>
      ${weeks.map(w=>`<tr><td>${w.st.getDate()} ${MES3[w.st.getMonth()]}</td><td class="r num">${w.n||'–'}</td><td class="r num ${cls(w.r)}">${w.n?eurS(w.r):'–'}</td></tr>`).join('')}
      </tbody></table></div>
  </div>
  <div class="block" style="margin-top:14px"><div class="head"><h2>Historial</h2></div>
    ${ops.length?`<div style="overflow:auto"><table class="ops"><thead><tr><th>Fecha</th><th>Activo</th><th class="r">Resultado</th><th>Nota</th><th></th></tr></thead><tbody>
      ${ops.map(o=>`<tr><td class="num">${o.f.slice(8)}/${o.f.slice(5,7)}/${o.f.slice(2,4)}</td><td>${esc(o.a)}</td><td class="r num ${cls(o.r)}">${eurS(o.r)}</td><td class="tiny">${esc(o.n)}</td><td class="r"><button class="del" data-act="delop" data-id="${o.id}" aria-label="Eliminar">✕</button></td></tr>`).join('')}
    </tbody></table></div>`:'<div class="empty">Aquí irán tus operaciones.</div>'}
  </div>`;
}
document.addEventListener('click',e=>{
  if(e.target.id!=='opAdd')return;
  const f=$('#opF').value,a=$('#opA').value.trim(),r=$('#opR').value,n=$('#opN').value.trim();
  if(!f||!a||r===''){toast('Faltan la fecha, el activo o el resultado');return;}
  S.trd.ops.push({id:uid(),t:Date.now(),f,a,r:+r,n});save('inv_trd',S.trd);render();toast('Operación añadida');
});

/* ============================== arranque ============================== */
(async function init(){
  await initSync();
  if(!hasStorage()&&!tok())$('#banner').classList.add('show');
  S.cfg=await store.get('cfg',{theme:null});applyTheme();
  const hc=await store.get('hab_cfg',null);
  if(hc&&hc.habits)S.hab=hc;else{S.hab={habits:DEFAULT_HABITS.map(h=>({id:uid(),name:h.name,days:h.days.slice()}))};save('hab_cfg',S.hab);}
  S.hor=await store.get('hor_cfg',{blocks:[]});if(!S.hor.blocks)S.hor.blocks=[];
  S.idx=await store.get('inv_idx',{aport:{},valor:null});
  S.trd=await store.get('inv_trd',{ops:[]});
  await loadMonth(S.y,S.m);
  await loadBud(S.budY);
  render();
  syncUI();
  arrancarSync();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
